# Render Blueprint — demo/production technical environment for AutoTrack API
# Docs: https://render.com/docs/blueprint-spec
#
# Secrets like DATABASE_URL must be set in the Render dashboard (or linked DB).
# Do not commit real credentials.

services:
  - type: web
    name: autotrack-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    # migrate + schema heal need DATABASE_URL (dashboard). start:render auto-heals missing User.
    buildCommand: npm ci && npx prisma migrate deploy && npm run build
    startCommand: npm run start:render
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SWAGGER_ENABLED
        value: "true"
      - key: PGSSL
        value: "true"
      - key: DATABASE_URL
        sync: false

# Optional: create a Render PostgreSQL and link DATABASE_URL in the dashboard.
# Free Postgres availability depends on the current Render plan/region.
# Alternative: Neon/Supabase and paste the connection string as DATABASE_URL.
