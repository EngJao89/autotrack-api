services:
  postgres:
    image: postgres:16-alpine
    container_name: autotrack-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: autotrack-api
    restart: unless-stopped
    ports:
      # Use API_PORT for host mapping — shell PORT often overrides .env
      - "${API_PORT:-3333}:3333"
    env_file:
      - .env
    environment:
      # Always listen on 3333 inside the container; host maps API_PORT:3333
      PORT: 3333
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      # File watching inside Docker (especially bind mounts)
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npm install --no-audit --no-fund &&
             npx prisma generate &&
             npx prisma migrate deploy &&
             npm run start:dev"

volumes:
  postgres_data:
  api_node_modules:
