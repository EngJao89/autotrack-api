name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://autotrack:autotrack@localhost:5432/autotrack?schema=public
  POSTGRES_USER: autotrack
  POSTGRES_PASSWORD: autotrack
  POSTGRES_DB: autotrack

jobs:
  quality:
    name: Lint, typecheck, tests and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autotrack
          POSTGRES_PASSWORD: autotrack
          POSTGRES_DB: autotrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autotrack -d autotrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build
